name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for secrets in code
      run: |
        echo "Проверка на наличие секретов в коде..."
        if grep -r "password.*=.*['\"][^'\"]*['\"]" config/ python/config.py 2>/dev/null; then
          echo "⚠️ Найдены возможные секреты в коде!"
          exit 1
        fi
        echo "✅ Секреты не найдены"

  check-env-files:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check .env not committed
      run: |
        if [ -f "python/.env" ]; then
          echo "❌ Файл .env не должен быть в репозитории!"
          exit 1
        fi
        echo "✅ .env файл не найден в репозитории"

  check-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Python dependencies
      run: |
        if [ -f "python/requirements.txt" ]; then
          echo "✅ requirements.txt найден"
          cat python/requirements.txt
        else
          echo "❌ requirements.txt не найден!"
          exit 1
        fi